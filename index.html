<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0814" />
    <meta name="description" content="Solo Leveling Life System - Futuristic anime RPG HUD personal development system for Study, Fitness, Learning, and Daily Quests." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <body class="bg-[#05040a] text-slate-100 antialiased selection:bg-purple-600 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = (window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/') + 'sw.js';
          navigator.serviceWorker.register(swUrl).catch(err => {
            console.log('SW registration note: ', err);
          });
        });
      }
    </script>
  </body>
</html>
